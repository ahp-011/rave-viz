<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rave Visualizer</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #1b1c1e; overflow: hidden; }
    canvas { position: fixed; inset: 0; }
    body.idle, body.idle * { cursor: none !important; }
    canvas { display: block; }
    #debug { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); max-width: calc(100vw - 24px); height: auto !important; pointer-events: none; border-radius: 4px; }

    #menu {
      position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); width: 260px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow-y: auto;
      padding: 14px; box-sizing: border-box;
      background: rgba(14,15,17,0.92); border: 1px solid #2c2e33; border-radius: 6px;
      color: #c8cad0; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
      display: flex; flex-direction: column; gap: 8px;
      opacity: 0; transform: translateY(8px); pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    #menu.open { opacity: 1; transform: none; pointer-events: auto; }
    #menu .title { color: #9b87ff; letter-spacing: .2em; font-size: 11px; }
    #menu button, #menu select {
      font: inherit; color: #e8e8ea; background: #1f2125; border: 1px solid #34363c;
      border-radius: 4px; padding: 7px 9px; text-align: left; cursor: pointer;
    }
    #menu button:hover, #menu select:hover { border-color: #9b87ff; }
    #menu .status { color: #8a8c92; min-height: 1.4em; word-break: break-word; }
    #menu .status.err { color: #ff8f8f; }
    #menu .keys { color: #6c6e74; font-size: 11px; border-top: 1px solid #2c2e33; padding-top: 8px; }
    #menu .keys span { color: #b8bac0; }

    body.dragging::after {
      content: 'drop audio file'; position: fixed; inset: 24px;
      border: 1px dashed #9b87ff; border-radius: 8px;
      display: grid; place-items: center;
      color: #c8cad0; font: 14px ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
